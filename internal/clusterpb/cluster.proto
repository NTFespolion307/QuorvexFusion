// Wire protocol between workers and the controller.
//
// Regenerate the Go code after editing with `make proto` (needs protoc,
// protoc-gen-go and protoc-gen-go-grpc). The generated files are committed so
// normal builds never need protoc.
syntax = "proto3";

package cluster.v1;

option go_package = "github.com/NTFespolion307/QuorvexFusion/internal/clusterpb";

// NodeService is served by the controller on its node port (default 7443).
// Workers are always the client: they dial out, so they need no open ports
// and work behind NAT and inside containers.
service NodeService {
  // Join trades a join token and a certificate signing request for a node
  // certificate. It is the only RPC callable without a client certificate,
  // and it is rate-limited per source IP.
  //
  // A worker whose join is pending approval calls Join again with the same
  // key (the token may be empty then); the CSR signature proves it is the
  // same node.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Connect is the long-lived control stream of an approved node. The first
  // worker message must be a Hello. Any message counts as a heartbeat.
  rpc Connect(stream WorkerMessage) returns (stream ControllerMessage);
}

message JoinRequest {
  string token = 1;
  bytes csr_der = 2;   // PKCS#10 CSR signed by the worker's private key
  string hostname = 3;
  string location = 4;
  bool ephemeral = 5;
}

message JoinResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    APPROVED = 1;
    PENDING = 2;
  }
  Status status = 1;
  string node_id = 2;
  bytes cert_der = 3;     // node certificate, set when APPROVED
  bytes ca_cert_der = 4;  // controller CA certificate
}

message WorkerMessage {
  oneof msg {
    Hello hello = 1;
    Metrics metrics = 2;
    Pong pong = 3;
    TaskStarted task_started = 4;
    LogChunk log = 5;
    TaskResult result = 6;
  }
}

message ControllerMessage {
  oneof msg {
    Welcome welcome = 1;
    Ping ping = 2;
    AssignTask assign = 3;
    CancelTask cancel = 4;
    ResultAck result_ack = 5;
  }
}

message Hello {
  string version = 1;
  HardwareInfo hardware = 2;
  string location = 3;
  bool ephemeral = 4;
  map<string, string> labels = 5;
  string shared_storage = 6;  // optional path shared with the controller/other nodes
  // Every attempt this worker still holds: running, still shipping logs, or
  // finished with a result not yet acknowledged. The controller adopts these
  // after a reconnect and treats any other attempt it placed here as lost.
  repeated string running_attempts = 7;
}

message Welcome {
  string node_id = 1;
  int32 metrics_interval_seconds = 2;
  // How much of each adopted attempt's logs the controller already has, so
  // the worker resumes shipping from there.
  map<string, LogOffsets> log_offsets = 3;
}

message LogOffsets {
  int64 stdout = 1;
  int64 stderr = 2;
}

// --- tasks ---

message GPUAssignment {
  int32 index = 1;
  string uuid = 2;
  string vendor = 3;
}

// TaskSpec is everything a worker needs to run one attempt of a task.
message TaskSpec {
  string command = 1;  // run with /bin/sh -c; {i} already substituted
  map<string, string> env = 2;
  double cpus = 3;
  uint64 memory_bytes = 4;  // 0 = no limit
  repeated GPUAssignment gpus = 5;
  int64 timeout_seconds = 6;  // 0 = no timeout
}

message AssignTask {
  string attempt_id = 1;
  string task_id = 2;
  string job_id = 3;
  int32 attempt = 4;  // 1 for the first attempt
  int64 array_index = 5;
  TaskSpec spec = 6;
}

message CancelTask {
  string attempt_id = 1;
  string reason = 2;
}

// ResultAck tells the worker it may delete its buffered result.
message ResultAck {
  string attempt_id = 1;
}

message TaskStarted {
  string attempt_id = 1;
  int64 started_unix_ms = 2;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STDOUT = 1;
  STDERR = 2;
}

message LogChunk {
  string attempt_id = 1;
  Stream stream = 2;
  int64 offset = 3;  // byte offset of data within the stream
  bytes data = 4;
}

message TaskResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    EXITED = 1;           // process exited; see exit_code
    FAILED_TO_START = 2;  // e.g. command not found by the runner itself
    TIMED_OUT = 3;
    CANCELED = 4;
    LOST = 5;             // worker restarted mid-task; not the task's fault
  }
  string attempt_id = 1;
  Outcome outcome = 2;
  int32 exit_code = 3;
  string error = 4;
  int64 started_unix_ms = 5;
  int64 finished_unix_ms = 6;
}

// Ping/Pong let the controller measure round-trip latency to each node.
message Ping {
  int64 nonce = 1;
}

message Pong {
  int64 nonce = 1;
}

message HardwareInfo {
  string hostname = 1;
  string os = 2;
  string kernel = 3;
  string arch = 4;
  string cpu_model = 5;
  int32 logical_cores = 6;
  int32 physical_cores = 7;
  // Cores actually usable after any cgroup CPU quota (e.g. inside a vast.ai
  // container). Equals logical_cores when unlimited.
  double cpu_limit = 8;
  // Usable RAM: the smaller of physical RAM and any cgroup memory limit.
  uint64 memory_bytes = 9;
  repeated Disk disks = 10;
  repeated GPU gpus = 11;
  bool in_container = 12;
  bool docker = 13;         // docker CLI present and daemon reachable
  bool nvidia_docker = 14;  // NVIDIA container toolkit usable with docker
  bool systemd = 15;        // systemd-run available for cgroup limits
  repeated string ips = 16;
  int64 boot_time_unix = 17;
}

message Disk {
  string mount = 1;
  string device = 2;
  string fstype = 3;
  uint64 total_bytes = 4;
  uint64 free_bytes = 5;
}

message GPU {
  int32 index = 1;
  string vendor = 2;  // "nvidia" or "amd"
  string name = 3;
  string uuid = 4;
  uint64 memory_bytes = 5;
  string driver = 6;
}

message Metrics {
  int64 time_unix_ms = 1;
  double cpu_percent = 2;
  repeated double cpu_per_core = 3;
  uint64 mem_used_bytes = 4;
  uint64 mem_total_bytes = 5;
  double load1 = 6;
  double load5 = 7;
  double load15 = 8;
  repeated DiskUsage disks = 9;
  uint64 net_rx_bytes_per_sec = 10;
  uint64 net_tx_bytes_per_sec = 11;
  repeated GPUMetrics gpus = 12;
  uint64 uptime_seconds = 13;
}

message DiskUsage {
  string mount = 1;
  uint64 used_bytes = 2;
  uint64 total_bytes = 3;
}

message GPUMetrics {
  int32 index = 1;
  double utilization_percent = 2;
  uint64 memory_used_bytes = 3;
  uint64 memory_total_bytes = 4;
  double temperature_c = 5;
  double power_watts = 6;
}
