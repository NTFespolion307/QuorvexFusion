<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · QuorvexFusion</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/public/theme.css">
  <link rel="stylesheet" href="/ui/public/base.css">
  <script src="/ui/public/login.js" defer></script>
</head>
<body>
  <div class="login-wrap">
    <form class="card login" id="login" autocomplete="on">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="4"/><circle cx="6" cy="8" r="2.5"/><circle cx="26" cy="8" r="2.5"/><circle cx="6" cy="24" r="2.5"/><circle cx="26" cy="24" r="2.5"/><path d="M8 9.5 13 14M24 9.5 19 14M8 22.5 13 18M24 22.5 19 18"/></svg>
        QuorvexFusion
      </div>
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <label class="field">Admin password
        <input type="password" name="password" id="password" autocomplete="current-password" required autofocus>
      </label>
      <div class="error-text hidden" id="error"></div>
      <button class="btn primary" type="submit" id="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
